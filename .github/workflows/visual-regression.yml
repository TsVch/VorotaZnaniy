name: Visual Regression Tests

on:
  pull_request:
    branches: [main]

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # pnpm install from the workspace root, scoped to the frontend package.
      # No `playwright install chromium` needed: the config uses the system
      # Chrome via channel: 'chrome' (ubuntu-latest ships Google Chrome), which
      # also keeps CI rendering identical to the locally-generated baselines.
      - name: Install dependencies
        run: |
          pnpm install --filter @knowledgevault/frontend
          cd frontend
          pnpm exec playwright install chrome

      - name: Run visual regression tests
        run: |
          cd frontend
          pnpm run test:visual

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
